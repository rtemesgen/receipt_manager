server.port=${PORT:8080}
spring.application.name=receipt-manager

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/receiptdb;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-for-production-use}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
